# BUOI 6 - QUY TRINH KIEM THU DAY DU
name: Kiểm thử đầy đủ

on:
  push:
  pull_request:
    branches: [main]

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Phân tích tĩnh bằng ESLint
        run: npm run lint
        continue-on-error: true

      - name: Kiểm thử đơn vị
        run: npm test

      - name: Cài trình duyệt cho Playwright
        if: always()
        run: npx playwright install --with-deps chromium

      - name: Kiểm thử API
        if: always()
        env:
          PLAYWRIGHT_HTML_REPORT: bao-cao/api
          PLAYWRIGHT_HTML_OUTPUT_DIR: bao-cao/api
        run: npx playwright test tests/api

      - name: Kiểm thử đầu cuối
        if: always()
        env:
          PLAYWRIGHT_HTML_REPORT: bao-cao/e2e
          PLAYWRIGHT_HTML_OUTPUT_DIR: bao-cao/e2e
        run: npx playwright test tests/e2e

      - name: Tải báo cáo kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-kiem-thu
          path: bao-cao/
          retention-days: 7
