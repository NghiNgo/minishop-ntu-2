# BUỔI 6 — PHẦN 2
#
# Đây là KHUNG của một quy trình kiểm thử tự động (pipeline). Bốn bước đầu
# đã có sẵn. Nhiệm vụ của sinh viên là hoàn thành TODO (5a) đến TODO (5e)
# để quy trình chạy đủ bốn tầng kiểm thử và lưu lại báo cáo.
#
# Lưu ý quan trọng về cú pháp YAML:
#   - thụt lề bằng DẤU CÁCH, không dùng Tab;
#   - mỗi bước bắt đầu bằng "- name:" và thẳng cột với các bước khác;
#   - sai thụt lề thì GitHub bỏ qua cả file và tab Actions không hiện gì.
# Kiểm tra cú pháp tại máy trước khi đẩy lên:
#   node -e "require('fs').readFileSync('.github/workflows/kiem-thu-day-du.yml','utf8')"
#   và dán nội dung vào một trình kiểm tra YAML trực tuyến.

name: Kiểm thử đầy đủ

# Chạy khi đẩy lên bất kỳ nhánh nào, và khi mở pull request vào main.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài thư viện
        run: npm ci

      # ESLint đặt continue-on-error vì bài Buổi 1 cố tình để lại cảnh báo.
      # Bước này báo vàng nhưng không chặn các bước sau.
      - name: Phân tích tĩnh bằng ESLint
        run: npm run lint
        continue-on-error: true

      # -----------------------------------------------------------
