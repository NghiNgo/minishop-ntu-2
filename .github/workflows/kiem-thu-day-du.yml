      # TODO (5f) — QUAN TRỌNG: MiniShop đang có lỗi thật, nên các bước
      #   kiểm thử sẽ ĐỎ. Theo mặc định, GitHub Actions DỪNG job ngay khi
      #   một bước thất bại, nên nếu để nguyên thì bước 5b, 5c, 5d, 5e
      #   không bao giờ chạy và ta không có báo cáo nào.
      #
      #   Thêm `if: always()` vào các bước 5b, 5c, 5d và 5e để chúng vẫn
      #   chạy sau khi một bước trước đó thất bại.
      #
      #   Chú ý phân biệt hai thứ:
      #     - `continue-on-error: true` khiến bước thất bại được coi như
      #       thành công, nên job vẫn XANH — che mất lỗi;
      #     - `if: always()` khiến bước vẫn chạy, nhưng job vẫn ĐỎ — vừa
      #       có đủ báo cáo, vừa giữ đúng trạng thái thật.
